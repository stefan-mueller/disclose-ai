project:
  type: website
  output-dir: docs

website:
  title: "AI Disclosure Generator"
  description: "A free tool that helps students write a clear AI-use disclosure statement for university assignments."
  site-url: "https://disclose-ai.app"
  favicon: favicon.svg
  back-to-top-navigation: true
  navbar:
    title: false
    logo: favicon.svg
    search: false
    border: true
    background: "white"
    pinned: true
    right:
      - href: "#about-this-tool"
        text: Overview
      - href: "#generate-declaration"
        text: Generate Declaration
      - href: "#about-the-maintainer"
        text: About
  page-footer:
    center: "Inspired by the [GAIDeT Declaration Generator](https://panbibliotekar.github.io/gaidet-declaration/) ([Suchikova et al. 2026](https://doi.org/10.1080/08989621.2025.2544331)), [MIT Licence](https://opensource.org/license/mit). Built by [Stefan Müller](https://muellerstefan.net) and Claude Code with [Quarto](https://quarto.org). Privacy with [Cabin](https://withcabin.com/privacy/disclose-ai.app)"

format:
  html:
    theme: flatly
    css: styles.css
    toc: false
    page-layout: article
    smooth-scroll: true
    anchor-sections: false
    grid:
      body-width: 1100px
