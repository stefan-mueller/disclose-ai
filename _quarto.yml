project:
  type: website
  output-dir: docs
  resources:
    - "count/"
  # Removes hidden copies of the code from the pages; see the script.
  post-render: strip-hidden-source.ts

lang: en-GB

website:
  title: "AI Disclosure Generator"
  description: "A free tool that helps students write a clear AI-use disclosure statement for university assignments."
  site-url: "https://disclose-ai.app"
  favicon: favicon.svg
  back-to-top-navigation: true
  # No site search, so its scripts aren't loaded on every page.
  search: false
  navbar:
    title: false
    logo: favicon.svg
    search: false
    border: true
    background: "#134e4a"
    pinned: true
    right:
      - href: index.qmd
        text: Home
      - href: "index.qmd#about-this-tool"
        text: Overview
      - href: "index.qmd#generate-declaration"
        text: Generate Declaration
      - href: lecturers.qmd
        text: For Lecturers
  page-footer:
    center: "Inspired by the [GAIDeT Declaration Generator](https://panbibliotekar.github.io/gaidet-declaration/) and the [Artificial Intelligence Disclosure (AID) Framework](https://arxiv.org/pdf/2408.01904). [MIT Licence](https://opensource.org/license/mit). Built by [Stefan Müller](https://muellerstefan.net). [Privacy Policy](privacy.qmd)"

format:
  html:
    theme: flatly
    # Colour theme: swap themes/green.css for another file in themes/
    # (e.g. themes/blue.css) to rebuild the site in that colour scheme.
    css:
      - themes/blue.css
      - styles.css
    toc: false
    page-layout: article
    smooth-scroll: true
    anchor-sections: false
    grid:
      body-width: 1100px
